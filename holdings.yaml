# holdings.yaml — the portfolio monitor's only configuration.
#
# Nothing here is a secret. The Anthropic key and the Gmail app password live
# in GitHub Secrets and are never read from this file.
#
# TWO THINGS IN HERE ARE PLACEHOLDERS AND ARE MEANT TO BE EDITED:
#
#   1. Every target_weight below is set to the ACTUAL weight on 2026-10-03,
#      not to a target anyone chose. Drift therefore reads ~0 for everything
#      until you set real targets. That was deliberate: the alternative was
#      inventing an asset allocation on your behalf.
#
#   2. The two managed funds and cash carry a manual `price`. They are not
#      fetched — VAN0004AU and VAN0003AU are APIR codes for unlisted funds
#      that don't trade, so no price feed has them. Paste a new price and
#      date when you think of it; the email flags prices older than 14 days.

portfolio:
  name: "LeLusis"
  currency: AUD

holdings:
  # --- Vanguard Personal Investor -----------------------------------------
  - ticker: VAN0004AU            # Vanguard Australian Property Securities Index Fund
    units: 2589.63
    target_weight: 6.2
    asset_type: managed_fund
    price: 0.874
    price_as_of: 2026-10-02

  - ticker: VAN0003AU            # Vanguard International Shares Index Fund
    units: 904.81
    target_weight: 11.0
    asset_type: managed_fund
    price: 4.4237
    price_as_of: 2026-10-01

  - ticker: VVLU.AX              # Vanguard Global Value Equity Active ETF
    units: 44
    target_weight: 9.7
    asset_type: etf

  - ticker: VGS.AX               # Vanguard MSCI Index International Shares ETF
    units: 6
    target_weight: 2.7
    asset_type: etf

  # --- Broker --------------------------------------------------------------
  - ticker: CLNE.AX
    units: 100
    target_weight: 2.2
    asset_type: equity

  - ticker: CWY.AX
    units: 409
    target_weight: 2.9
    asset_type: equity

  - ticker: KKC.AX               # listed investment trust — has an NTA, so
    units: 1428                  # premium/discount applies to it in phase 2
    target_weight: 7.9
    asset_type: lic

  - ticker: OCL.AX
    units: 142
    target_weight: 2.4
    asset_type: equity

  # --- Cash ----------------------------------------------------------------
  - ticker: CASH
    units: 20000
    target_weight: 55.0
    asset_type: cash
    price: 1.00
    price_as_of: 2026-10-03

targets:
  tolerate_unallocated_pct: 0
  # Warn when a manual price is older than this many days.
  stale_price_days: 14

alerts:
  - name: "Drifted far from target"
    type: weight_drift
    exceeds_pct_points: 5

  - name: "Big weekly move"
    type: price_move
    abs_change_pct: 10

email:
  also_to: []
  note_threshold_pct: 3
